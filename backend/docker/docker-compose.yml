version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: solmar_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-solmar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - solmar_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: solmar_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/solmar
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key}
      PORT: 8080
      NODE_ENV: production
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - solmar_network
    volumes:
      - ../.env:/app/.env

networks:
  solmar_network:
    driver: bridge

volumes:
  postgres_data:
